name: Publish npm

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

jobs:
  publish-npm:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)
          if [ -z "$tag" ]; then
            echo "No git tag found for workflow run head SHA" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Download Release workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" --dir artifacts

      - name: Prepare npm packages
        run: |
          node scripts/prepare-npm-release.mjs

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            npm/platforms/darwin-arm64 \
            npm/platforms/darwin-x64 \
            npm/platforms/linux-arm64-gnu \
            npm/platforms/linux-x64-gnu \
            npm/platforms/windows-x64-msvc
          do
            npm publish "$dir"
          done

      - name: Publish main package
        run: |
          npm publish npm/main
