name: Publish npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to npm, for example v0.1.3
        required: true
        type: string
      dry_run:
        description: Prepare packages without publishing
        type: boolean
        default: false

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_ARTIFACT_DIR: artifacts
      RELEASE_VERSION: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.18.0
          node --version
          npm --version

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "$RELEASE_VERSION"

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${RELEASE_VERSION}" --dir artifacts --pattern '*'

      - name: Prepare npm packages
        run: |
          node scripts/prepare-npm-release.mjs

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            npm/platforms/darwin-arm64 \
            npm/platforms/darwin-x64 \
            npm/platforms/linux-arm64-gnu \
            npm/platforms/linux-x64-gnu \
            npm/platforms/windows-x64-msvc
          do
            name=$(node -p "require('./$dir/package.json').name")
            version="${RELEASE_VERSION#v}"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish "./$dir" --provenance --access public --loglevel=verbose
            fi
          done

      - name: Publish main package
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if npm view "rust-silk@$version" version >/dev/null 2>&1; then
            echo "rust-silk@$version already published"
          else
            npm publish ./npm/main --provenance --access public --loglevel=verbose
          fi

      - name: Pack without publishing
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          for dir in npm/platforms/* npm/main; do
            npm pack "./$dir" --dry-run
          done

      - name: Dispatch installation verification
        if: ${{ !inputs.dry_run }}
        run: gh workflow run post-release-verify.yml --ref "$RELEASE_VERSION" -f "release_tag=$RELEASE_VERSION"
