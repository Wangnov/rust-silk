name: Publish npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to npm, for example v0.1.3
        required: true
        type: string
  workflow_run:
    workflows:
      - Release
    types:
      - completed

jobs:
  publish-npm:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)
          fi
          if [ -z "$tag" ]; then
            echo "No git tag found for workflow run head SHA" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${RELEASE_VERSION}" --dir artifacts --pattern '*'

      - name: Prepare npm packages
        run: |
          node scripts/prepare-npm-release.mjs

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            npm/platforms/darwin-arm64 \
            npm/platforms/darwin-x64 \
            npm/platforms/linux-arm64-gnu \
            npm/platforms/linux-x64-gnu \
            npm/platforms/windows-x64-msvc
          do
            npm publish "$dir"
          done

      - name: Publish main package
        run: |
          npm publish npm/main
